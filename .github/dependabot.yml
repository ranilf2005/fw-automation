# SPDX-License-Identifier: MIT
version: 2
updates:
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, python]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-dev)"
    labels: [dependencies, python]

  - package-ecosystem: pip
    directory: /mcp_servers/rest-api-mcp
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, mcp]

  - package-ecosystem: pip
    directory: /mcp_servers/ansible-mcp
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, mcp]

  - package-ecosystem: pip
    directory: /mcp_servers/terraform-mcp
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, mcp]

  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, terraform]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    labels: [dependencies, github-actions]

  - package-ecosystem: docker
    directories:
      - /mcp_servers/rest-api-mcp
      - /mcp_servers/ansible-mcp
      - /mcp_servers/terraform-mcp
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, docker]
