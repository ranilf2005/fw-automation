services:
  sfw-mcp-rest:
    build: .
    image: sfw-mcp-rest:1.0.0
    container_name: sfw-mcp-rest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
    ports:
      # Bound to loopback on purpose. This server has no built-in authentication;
      # put a TLS-terminating authenticating proxy in front before exposing it.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./profiles:/app/profiles:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
