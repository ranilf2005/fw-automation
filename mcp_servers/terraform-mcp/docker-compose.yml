services:
  sfw-mcp-terraform:
    build: .
    image: sfw-mcp-terraform:1.0.0
    container_name: sfw-mcp-terraform
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8002"
      TF_MCP_WORKSPACES: starter=/workspaces/terraform
      TF_PLUGIN_CACHE_DIR: /cache/terraform-plugins
    ports:
      # Loopback only. No built-in authentication; front it with an authenticating proxy.
      - "127.0.0.1:8002:8002"
    volumes:
      # Terraform needs to write .terraform/ and state, so this mount is read-write.
      # Point it at a dedicated IaC checkout, not a shared working directory.
      - ../../terraform:/workspaces/terraform
      - terraform-plugin-cache:/cache/terraform-plugins
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  terraform-plugin-cache:
