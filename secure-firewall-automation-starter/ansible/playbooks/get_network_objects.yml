- name: Get network objects
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:
    - name: Assert credentials are present
      ansible.builtin.assert:
        that:
          - fmc_password | length > 0
        fail_msg: >-
          FMC_PASSWORD is not set. Export it, or pass an ansible-vault file with
          -e @ansible/vars/vault.yml. See ansible/group_vars/all.yml.

    - name: Get network objects
      cisco.fmcansible.fmc_configuration:
        operation: getAllNetworkObject
        path_params:
          domainUUID: "{{ domain_uuid }}"
        query_params:
          limit: 1000
        register_as: result
      vars:
        ansible_httpapi_host: "{{ fmc_hostname }}"
        ansible_user: "{{ fmc_username }}"
        ansible_httpapi_pass: "{{ fmc_password }}"
        ansible_httpapi_validate_certs: "{{ fmc_verify_ssl }}"
      no_log: true

    - name: Show result
      ansible.builtin.debug:
        var: result
